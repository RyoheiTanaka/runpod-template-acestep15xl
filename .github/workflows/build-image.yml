name: Build image

# The Runpod Hub builds its own image from this repository and keeps it in
# registry.runpod.net, which is only pullable through a Hub deploy. That leaves
# no way to run this container anywhere else -- including a plain Pod, which is
# where its logs are actually readable. This workflow publishes the same build
# to GHCR so the image can be pulled normally, for diagnosis and for anyone who
# wants to run it outside the Hub.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cuda12.8 is the default. The old runpod base carried
        # NVIDIA_REQUIRE_CUDA, which failed a container before it started when
        # the host was below the required version; the pytorch base does not
        # appear to, so an unsuitable host will surface as a runtime error
        # instead. allowedCudaVersions in hub.json is what keeps deploys on
        # hosts that can actually run this.
        cuda:
          # The default, and what the Hub itself builds: the Hub passes no
          # build-args, so the Dockerfile's own ARG default is what it uses.
          - tag: cuda12.8
            base: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
          # Kept as an option. On cu128 comfy-kitchen reports its cuda and
          # triton backends as disabled and falls back to eager, so a cu130
          # build may generate faster -- unmeasured, and on a heavier base.
          - tag: cuda13.0
            base: runpod/pytorch:1.1.0-cu1300-torch291-ubuntu2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ryoheitanaka/runpod-template-acestep15xl
          tags: |
            type=raw,value=latest-${{ matrix.cuda.tag }},enable={{is_default_branch}}
            type=ref,event=tag,suffix=-${{ matrix.cuda.tag }}
            type=sha,suffix=-${{ matrix.cuda.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.cuda.base }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
